# Builds gitcraft for Windows, Linux and macOS and publishes a GitHub release when a `v*` tag is pushed.
# Run it by hand (Actions › Release › Run workflow) to only build and download the artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only for the builds (they run tests, build scripts and downloaded tools); only the
# release job below can write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          # The oldest supported runner, so the binary runs on older glibc too.
          - os: ubuntu-22.04
            name: linux-x86_64
          # Builds for Apple silicon and Intel, joined into one universal app.
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The base of every file name. The tag or branch reaches the scripts only through the
      # environment, made safe for a file name (a branch like `feature/x` has a slash).
      - name: Package name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.name }}
        run: |
          ref="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          echo "PKG=gitcraft-$ref-$TARGET" >> "$GITHUB_ENV"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev libdbus-1-dev pkg-config

      - name: Test
        run: cargo test --locked

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: App, dmg and zip (macOS)
        if: runner.os == 'macOS'
        run: |
          name="$PKG"
          version="$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          sh packaging/macos/build-app.sh "$version" "$name"
          # Both architectures, signed, and the disk image is sound.
          mkdir check
          ditto -x -k "$name.zip" check
          lipo -archs check/gitcraft.app/Contents/MacOS/gitcraft
          lipo -archs check/gitcraft.app/Contents/MacOS/gitcraft | grep -q x86_64
          lipo -archs check/gitcraft.app/Contents/MacOS/gitcraft | grep -q arm64
          codesign --verify --strict check/gitcraft.app
          plutil -lint check/gitcraft.app/Contents/Info.plist
          hdiutil verify "$name.dmg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = $env:PKG
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/gitcraft.exe, README.md, ATTRIBUTION.md, LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" "/DOutputName=$($env:PKG)-setup" packaging\windows\gitcraft.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist\*.exe .

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="$PKG"
          mkdir "$dir"
          cp target/release/gitcraft README.md ATTRIBUTION.md LICENSE-MIT LICENSE-APACHE \
            packaging/gitcraft.desktop "$dir/"
          cp assets/app-icon/gitcraft-256.png "$dir/gitcraft.png"
          strip "$dir/gitcraft"
          tar czf "$dir.tar.gz" "$dir"

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          # The runner has no FUSE: appimagetool unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          sh packaging/linux/build-appimage.sh "$PKG.AppImage"

      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: deb and rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          name="$PKG"
          strip target/release/gitcraft
          cargo deb --no-build --output "$name.deb"
          cargo generate-rpm --output "$name.rpm"
          # The .deb installs, with its menu entry and icon; the .rpm holds the same files.
          sudo apt-get install -y desktop-file-utils rpm "./$name.deb"
          desktop-file-validate /usr/share/applications/gitcraft.desktop
          test -x /usr/bin/gitcraft
          test -f /usr/share/icons/hicolor/256x256/apps/gitcraft.png
          rpm -qp --requires "$name.rpm"
          rpm -qlp "$name.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: gitcraft-${{ matrix.name }}
          path: |
            gitcraft-*.zip
            gitcraft-*.dmg
            gitcraft-*.tar.gz
            gitcraft-*-setup.exe
            gitcraft-*.AppImage
            gitcraft-*.deb
            gitcraft-*.rpm

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
