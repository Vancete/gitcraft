<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS: Apple's icon grid leaves the body 824 px of the 1024 canvas, with room around it
       for the drop shadow; the same artwork as gitcraft.svg, scaled into that body. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9bf7"/>
      <stop offset="1" stop-color="#2f7bf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(1.609375)">
    <rect width="512" height="512" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
    <g fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round">
      <path d="M182 150V362"/>
      <path d="M330 168C330 268 182 248 182 330"/>
    </g>
    <g fill="#ffffff">
      <circle cx="182" cy="130" r="50"/>
      <circle cx="182" cy="382" r="50"/>
      <circle cx="330" cy="168" r="50"/>
    </g>
    <circle cx="182" cy="130" r="20" fill="#2f7bf5"/>
  </g>
</svg>
